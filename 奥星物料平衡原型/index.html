<title>奥星日物料平衡原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 左侧导航 + 顶部生产日/角色条 + 内容区;每页"设计说明"折叠卡说明用途、角色与操作 */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --sunk:#f7f8fa; --ink:#121820; --ink2:#4a5561; --muted:#7f8994;
  --line:#e2e6eb; --line2:#cfd5dc; --accent:#1d5fa6; --accent-ink:#ffffff; --accent-soft:#e7eff9;
  --side:#18212c; --side-ink:#c9d2dc; --side-active:#26354a; --demo:#fff4d6; --demo-ink:#6b4d00;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --neg:#e34948;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-soft:#e5f5e5; --warn-soft:#fff3d6; --serious-soft:#fdeae2; --crit-soft:#fbe5e5; --info-soft:#e7eff9;
  --band:rgba(42,120,214,.08);
  --sans:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono","SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1318; --surface:#181d24; --sunk:#141920; --ink:#eef1f4; --ink2:#b9c2cc; --muted:#8a939d;
  --line:#2a313a; --line2:#39424d; --accent:#4b8fe0; --accent-ink:#0b1220; --accent-soft:#1d2b3d;
  --side:#0b0f14; --side-ink:#aeb8c3; --side-active:#1d2734; --demo:#3a2e10; --demo-ink:#f3d58a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --neg:#e66767;
  --good-soft:#15301a; --warn-soft:#362b10; --serious-soft:#3a2219; --crit-soft:#3b1a1a; --info-soft:#1d2b3d;
  --band:rgba(57,135,229,.12); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1318; --surface:#181d24; --sunk:#141920; --ink:#eef1f4; --ink2:#b9c2cc; --muted:#8a939d;
  --line:#2a313a; --line2:#39424d; --accent:#4b8fe0; --accent-ink:#0b1220; --accent-soft:#1d2b3d;
  --side:#0b0f14; --side-ink:#aeb8c3; --side-active:#1d2734; --demo:#3a2e10; --demo-ink:#f3d58a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --neg:#e66767;
  --good-soft:#15301a; --warn-soft:#362b10; --serious-soft:#3a2219; --crit-soft:#3b1a1a; --info-soft:#1d2b3d;
  --band:rgba(57,135,229,.12); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:4px 10px 16px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:12px}
.brand b{display:block;color:#fff;font-size:15px;letter-spacing:.02em}
.brand span{font-size:12px;opacity:.7}
.navgrp{font-size:11px;letter-spacing:.08em;opacity:.55;padding:12px 10px 4px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:6px;color:var(--side-ink);text-decoration:none;font-size:13.5px}
.nav a:hover{background:var(--side-active)}
.nav a.on{background:var(--side-active);color:#fff;box-shadow:inset 2px 0 0 var(--s1)}
.nav a:focus-visible{outline:2px solid var(--s1);outline-offset:1px}
.badge{font-size:11px;padding:0 6px;border-radius:9px;background:rgba(255,255,255,.1)}
.badge.hot{background:var(--crit);color:#fff}
.badge.p2{background:transparent;border:1px solid rgba(255,255,255,.25)}
.main{min-width:0;display:flex;flex-direction:column}
.demo{background:var(--demo);color:var(--demo-ink);font-size:12.5px;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.field{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2)}
.field select,.field input{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line2);border-radius:6px;padding:4px 8px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 12px;cursor:pointer;font-size:13px}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.stepper{display:flex;align-items:center;gap:4px;margin-left:auto;flex-wrap:wrap;font-size:12px}
.step{display:flex;align-items:center;gap:5px;padding:3px 9px;border-radius:12px;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.step.done{color:var(--ink2);background:var(--good-soft);border-color:transparent}
.step.cur{color:var(--ink);background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.step i{font-style:normal;font-size:11px}
.arrow{color:var(--muted)}
.content{padding-block:20px 48px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;max-width:1360px;width:100%}
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.phead h1{font-size:21px;margin:0;text-wrap:balance}
.phead p{margin:2px 0 0;color:var(--ink2);font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line2);background:var(--surface);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.design{background:var(--surface);border:1px dashed var(--line2);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--ink2)}
.design summary{cursor:pointer;color:var(--ink);font-weight:600}
.design ul{margin:8px 0 2px;padding-left:18px;display:grid;gap:3px}
.design b{color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.card h2{font-size:14.5px;margin:0 0 2px}
.card .sub{font-size:12px;color:var(--muted);margin:0 0 10px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.tile .l{font-size:12px;color:var(--ink2)}
.tile .v{font-size:22px;font-weight:600;margin-top:2px;white-space:nowrap}
.tile .v small{font-size:12px;font-weight:400;color:var(--muted);margin-left:3px}
.tile .d{font-size:12px;color:var(--muted);margin-top:2px}
.eq{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.eq .t{flex:1 1 110px;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
.eq .t .l{font-size:12px;color:var(--ink2)}
.eq .t .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.eq .t.res{background:var(--accent-soft);border-color:var(--accent)}
.eq .op{align-self:center;color:var(--muted);font-size:18px}
.tw{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:600;color:var(--ink2);text-align:left;font-size:12px;padding:7px 8px;border-bottom:1px solid var(--line2);white-space:nowrap;background:var(--sunk)}
td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
tr.click:hover td,tr.sel td{background:var(--accent-soft)}
tfoot td{font-weight:600;border-top:1px solid var(--line2)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:1px 8px;border-radius:10px;white-space:nowrap;color:var(--ink)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.good{background:var(--good-soft)} .chip.good::before{background:var(--good)}
.chip.warn{background:var(--warn-soft)} .chip.warn::before{background:var(--warn)}
.chip.serious{background:var(--serious-soft)} .chip.serious::before{background:var(--serious)}
.chip.crit{background:var(--crit-soft)} .chip.crit::before{background:var(--crit)}
.chip.info{background:var(--info-soft)} .chip.info::before{background:var(--s1)}
.chip.mute{background:var(--sunk);color:var(--ink2)} .chip.mute::before{background:var(--muted)}
.tag{font-size:11.5px;padding:0 6px;border:1px solid var(--line2);border-radius:4px;color:var(--ink2);white-space:nowrap}
.pos{color:var(--ink)} .mono{font-family:var(--mono);font-size:12px}
.meter{display:inline-block;width:70px;height:8px;border-radius:4px;background:var(--accent-soft);vertical-align:middle;overflow:hidden}
.meter i{display:block;height:100%;background:var(--s1);border-radius:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.legend i.ln{height:2px;width:14px}
svg text{fill:var(--muted);font-size:11px;font-family:var(--sans)}
.todo{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.todo li{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.todo li div{min-width:0}
.todo .m{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.chain{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px}
.chain .u{flex:1 1 180px;border:1px solid var(--line2);border-radius:8px;padding:10px 12px;background:var(--sunk);cursor:pointer;min-width:0}
.chain .u.on{border-color:var(--accent);background:var(--accent-soft)}
.chain .u.off{opacity:.55;cursor:default}
.chain .u b{display:block}
.chain .u .m{font-size:12px;color:var(--ink2)}
.chain .ar{align-self:center;color:var(--muted)}
.trace{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.trace .lv{border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--sunk);min-width:0}
.trace .lv h3{margin:0 0 6px;font-size:13px}
.trace .lv p{margin:2px 0;font-size:12.5px;color:var(--ink2);white-space:normal}
.segbar{display:flex;gap:2px;height:28px;margin:4px 0 12px}
.segbar div{border-radius:4px;color:#fff;font-size:11.5px;padding:0 6px;display:flex;align-items:center;white-space:nowrap;overflow:visible;min-width:0}
.ul{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.tree{list-style:none;margin:0;padding:0;font-size:13px}
.tree ul{list-style:none;margin:0;padding-left:18px;border-left:1px solid var(--line)}
.tree li{padding:3px 0}
.tree .k{color:var(--muted);font-size:12px;margin-left:6px}
.report{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:22px 26px;max-width:900px}
.report h2{text-align:center;font-size:18px;margin:0}
.report .meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--ink2);margin:10px 0 12px}
.report .sign{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:16px;font-size:12.5px;color:var(--ink2)}
.note{font-size:12px;color:var(--muted)}
.tip{position:fixed;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line2);box-shadow:0 4px 16px rgba(0,0,0,.12);border-radius:6px;padding:6px 9px;font-size:12px;z-index:50;max-width:260px}
.toast{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;font-size:13px;z-index:60;max-width:calc(100vw - 40px)}
.lock{font-size:11.5px;color:var(--muted)}
@media (max-width:1100px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;padding:10px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}
  .brand{border:0;padding:2px 4px 8px;margin:0}
  .navgrp{display:none}
  .nav{display:flex;gap:4px;overflow-x:auto}
  .nav a{white-space:nowrap}
  .g2e,.trace{grid-template-columns:minmax(0,1fr)}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stepper{margin-left:0}
  .top{position:static}
  .report{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</div>

function drawDev(){
  const el=$('#devChart');if(!el)return;
  const W=680,H=230,L=40,R=12,T=12,B=26,yMin=-.6,yMax=1.4;
  const x=i=>L+i*(W-L-R)/29, y=v=>T+(yMax-v)*(H-T-B)/(yMax-yMin);
  let g='';
  [-0.5,0,.5,1].forEach(v=>{g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v.toFixed(1)}</text>`;});
  g=`<rect x="${L}" y="${y(.5)}" width="${W-L-R}" height="${y(-.5)-y(.5)}" fill="var(--band)"/>`+g+`<line x1="${L}" x2="${W-R}" y1="${y(1)}" y2="${y(1)}" stroke="var(--crit)" stroke-dasharray="4 3" stroke-width="1"/>`;
  [0,7,14,21,29].forEach(i=>g+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${DAYS[i]}</text>`);
  let path='',pen=false;DEV.forEach((v,i)=>{if(v==null){pen=false;return;}path+=(pen?'L':'M')+x(i)+' '+y(v);pen=true;});
  g+=`<path d="${path}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  DEV.forEach((v,i)=>{
    if(v==null){g+=`<circle cx="${x(i)}" cy="${y(0)}" r="4.5" fill="var(--surface)" stroke="var(--muted)" stroke-dasharray="2 2"/>`;}
    else if(Math.abs(v)>1){g+=`<circle cx="${x(i)}" cy="${y(v)}" r="5" fill="var(--crit)" stroke="var(--surface)" stroke-width="2"/>`;}
    else if(i===29){g+=`<circle cx="${x(i)}" cy="${y(v)}" r="5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/><text x="${x(i)-8}" y="${y(v)-10}" text-anchor="end" style="fill:var(--ink);font-weight:600">${v.toFixed(2)}%</text>`;}
  });
  g+=`<line id="xh" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--line2)" visibility="hidden"/>`;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="近30天全厂偏差率折线图">${g}<rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent" id="hit"/></svg>`;
  const svg=el.querySelector('svg'),hit=el.querySelector('#hit'),xh=el.querySelector('#xh');
  hit.addEventListener('mousemove',e=>{const r=svg.getBoundingClientRect();const px=(e.clientX-r.left)*W/r.width;const i=Math.max(0,Math.min(29,Math.round((px-L)/((W-L-R)/29))));xh.setAttribute('x1',x(i));xh.setAttribute('x2',x(i));xh.setAttribute('visibility','visible');
    const v=DEV[i];showTip(e,`<b>2026-${DAYS[i]}</b><br>${v==null?'无确认值(补采中)':'偏差率 '+v.toFixed(2)+'%'}${DEVNOTE[i]?'<br><span class="note">'+DEVNOTE[i]+'</span>':''}`);});
  hit.addEventListener('mouseleave',()=>{hideTip();xh.setAttribute('visibility','hidden');});
}

function unitCalc(u){
  const U=UNITS[u];const tin=sum(U.ins);let outs=U.outs.map(o=>({...o}));let loss=null,gap,unexpl;
  if(u==='hc'){loss=tin*U.lossPct/100;const known=outs.filter(o=>o.q!=null).reduce((s,o)=>s+o.q,0);gap=tin-known;outs.find(o=>o.q==null).q=gap-loss;unexpl=0;}
  else if(u==='cdu'){const o=sum(outs);gap=tin-o;loss=tin*U.lossPct/100;unexpl=gap-loss;}
  else {const o=sum(outs);gap=tin-o;loss=gap;unexpl=0;}
  return {tin,outs,loss,gap,unexpl};
}

const VIEWS={overview:vOverview,tanks:vTanks,units:vUnits,exceptions:vExc,confirm:vConfirm,config:vConfig,report:vReport};
function renderChrome(){
  const groups=[...new Set(PAGES.map(p=>p.grp))];
  $('#nav').innerHTML=groups.map(g=>`<div class="navgrp">${g}</div>`+PAGES.filter(p=>p.grp===g).map(p=>{
    const n=p.id==='exceptions'?EXC.filter(e=>e.st==='待处理'&&(S.role==='plan'||e.role===S.role)).length:0;
    const home=ROLES[S.role].home===p.id;
    return `<a href="#${p.id}" class="${S.page===p.id?'on':''}" ${p.roles.includes(S.role)?'':'style="opacity:.45"'}>${p.name}<span>${home?'<span class="badge">首页</span>':''}${p.p2?'<span class="badge p2">二期</span>':''}${n?`<span class="badge hot">${n}</span>`:''}</span></a>`;}).join('')).join('');
  $('#roles').innerHTML=Object.entries(ROLES).map(([k,r])=>`<button class="${S.role===k?'on':''}" data-role="${k}" title="${r.who}">${r.name}</button>`).join('');
  $('#stepper').innerHTML=STAGES.map((s,i)=>(i?'<span class="arrow">›</span>':'')+`<span class="step ${i<S.stage?'done':i===S.stage?'cur':''}"><i>${i<S.stage?'✓':i+1}</i>${s}</span>`).join('');
}
function render(){
  renderChrome();
  const page=PAGES.find(p=>p.id===S.page);
  let html=VIEWS[S.page]();
  if(!page.roles.includes(S.role))html=`<div class="card" style="background:var(--warn-soft)">当前角色"${ROLES[S.role].name}"通常不使用此页,原型中仍可浏览。</div>`+html;
  $('#view').innerHTML=html;
  drawDev();drawAA();drawYield();
  if(S.page==='tanks')tankTrace('T103');
}
function route(){const h=location.hash.slice(1);S.page=VIEWS[h]?h:S.page;render();window.scrollTo(0,0);}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-role],[data-act],[data-tank],[data-unit],[data-close],[data-sel],[data-cfg]');if(!t||t.disabled)return;
  if(t.dataset.role){S.role=t.dataset.role;try{localStorage.setItem('ax_role',S.role)}catch(_){}location.hash=ROLES[S.role].home;if(S.page===ROLES[S.role].home)render();toast(`已切换到${ROLES[S.role].name}视角:${ROLES[S.role].who}`);return;}
  if(t.dataset.tank){document.querySelectorAll('tr.sel').forEach(r=>r.classList.remove('sel'));t.classList.add('sel');tankTrace(t.dataset.tank);return;}
  if(t.dataset.unit){S.unit=t.dataset.unit;render();return;}
  if(t.dataset.sel){S.sel=t.dataset.sel;render();return;}
  if(t.dataset.cfg){S.cfgTab=t.dataset.cfg;render();return;}
  if(t.dataset.close){const x=EXC.find(z=>z.id===t.dataset.close);x.st='已关闭';x.note=x.note||'原型:已填写原因';render();toast(`${x.id} 已关闭,系统重算受影响数量`);return;}
  const a=t.dataset.act;
  if(a==='tankok'){if(S.stage<1){S.stage=1;}toast('罐区平衡已确认(罐区计量员)');render();}
  else if(a==='publish'){if(S.stage<1){toast('须先由罐区计量员确认罐区平衡');return;}S.stage=Math.max(S.stage,2);render();toast(`v${S.ver} 已发布,确认值已推送日效益`);}
  else if(a==='lockm'){if(S.stage<2){toast('须先发布确认值');return;}S.stage=3;render();toast('11 月已月结锁定,后续修订走审批');}
  else if(a==='recol'){RECOL[0].last='2026-11-12';render();toast('已重采 11-08:规则 R02 仍触发,仅更新最近计算日');}
  else if(a==='recalc'){if(S.stage>=2){toast('本日已发布或已锁定,不能直接重算;请在"数据确认与发布"页申请修订,经口径负责人审批');return;}newVersion('发布前重算','系统');render();toast(`已重算,生成 v${S.ver},上一草稿作废`);}
  else if(a==='revise'){if(S.stage<2){toast('本日尚未发布,可直接重算,无需修订审批');return;}newVersion('修订:补录 T305 漏录出库 2 车(口径负责人 张某 已审批)','李某');render();toast(`修订已审批,生成 v${S.ver};发布后通知日效益重算当日及月累计`);}
  else if(a==='mapit'){EXC.find(z=>z.id==='E-1111-04').st='已关闭';toast('已映射,磅单 BD-0386 进入计算');render();}
  else toast('原型:此操作仅演示入口位置');
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.unit){S.unit=e.target.dataset.unit;render();}});
$('#pday').addEventListener('change',()=>toast('原型只含 2026-11-11 的演示数据'));
window.addEventListener('hashchange',route);
S.page=VIEWS[location.hash.slice(1)]?location.hash.slice(1):ROLES[S.role].home;render();
</script>
